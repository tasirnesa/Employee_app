<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Employee Evaluation System</title>
    <script>
      window.addEventListener('error', function(e) {
        if (document.body) {
          document.body.innerHTML = '<div style="color:red;font-size:18px;padding:20px;background:#111;z-index:9999;position:fixed;top:0;left:0;width:100%;height:100%;overflow:auto;"><h3>CRITICAL ERROR CAUSING BLANK SCREEN:</h3><pre>' + (e.error ? e.error.stack : e.message) + '</pre></div>';
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        if (document.body) {
          document.body.innerHTML = '<div style="color:red;font-size:18px;padding:20px;background:#111;z-index:9999;position:fixed;top:0;left:0;width:100%;height:100%;overflow:auto;"><h3>PROMISE REJECTION:</h3><pre>' + (e.reason ? e.reason.stack || e.reason : 'Unknown') + '</pre></div>';
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
